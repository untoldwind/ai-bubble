[package]
name = "ai-bubble"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Minimal bubblewrap-like sandboxing CLI, configured via a spec file"

[dependencies]
seccompiler = "0.5"
shellexpand = "3"
syscalls = "0.8"
schemars = "1.2"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
fuse3 = { version = "0.9.0", features = ["tokio-runtime", "unprivileged"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
futures-util = "0.3.34"
libc = "0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simple-dns = "0.12"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "time", "sync", "signal"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
base64 = "0.23"

[profile.release]
debug=true
