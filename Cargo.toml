[package]
name = "rs-bubble"
version = "0.1.0"
edition = "2024"

[build-dependencies]
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
schemars = "0.8"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
fuse3 = { version = "0.9.0", features = ["tokio-runtime", "unprivileged"] }
futures-util = "0.3.34"
libc = "0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "fs", "macros", "time"] }
